<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore public events at Monad Place, including the Arizona Creative Mixer and The Resonance Room. See event details and upcoming dates.">
  <link rel="canonical" href="https://monadplace.github.io/Monad-Place/events/">
  <title>Phoenix-Area Community Events | Monad Place</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;family=Playfair+Display:wght@500;600&amp;display=swap">
  <link rel="stylesheet" href="../assets/community.css">
  <script defer src="../assets/events-data.js?v=event-views-1"></script>
  <script defer src="../assets/events.js?v=event-views-1"></script>
  <link rel="icon" type="image/svg+xml" sizes="any" href="../assets/monad-favicon.svg">
  <link rel="stylesheet" href="../assets/site-header.css">
  <style>
    [data-event-list] { display: grid; gap: 12px; margin-block: 24px 48px; }
    .event-row { border: 1px solid #61502b; background: #1b1710; }
    .event-row summary { cursor: pointer; padding: 12px 16px; color: var(--community-ivory); }
    .event-row summary strong { margin-inline: 6px 12px; }
    .event-row summary .event-next-date { display: inline-block; font-size: .85rem; color: var(--community-gold); }
    .event-row-content { padding: 0 16px 16px; }
    .event-row-content p { margin: 0 0 8px; }
      .event-flyer { display: block; width: min(100%, 320px); height: auto; margin: 0 0 16px; }
      [data-event-list] { grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); align-items: start; }
    .hosted-event > .event-flyer { margin-inline: auto; }
      .community-intro { padding-block: clamp(24px, 4vw, 48px) 18px; }
    .event-section-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .event-section-links button { min-height: 44px; padding: 6px 14px; border: 1px solid #61502b; color: var(--community-ivory); background: #1b1710; font: inherit; cursor: pointer; }
    .event-section-links button[aria-pressed="true"] { color: #100e0b; background: var(--community-gold); }
    [data-event-list] { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
    .event-empty { grid-column: 1 / -1; }
    @media (max-width: 650px) { [data-event-list] { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="community-page">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="monad-flower" viewBox="0 0 100 100">
      <g fill="none" stroke="#d4af37" stroke-width="1.25">
        <circle cx="50" cy="50" r="45"/><circle cx="50" cy="29" r="21"/><circle cx="68.2" cy="39.5" r="21"/><circle cx="68.2" cy="60.5" r="21"/><circle cx="50" cy="71" r="21"/><circle cx="31.8" cy="60.5" r="21"/><circle cx="31.8" cy="39.5" r="21"/>
        <circle cx="50" cy="50" r="2.7" fill="#f4d978" stroke="#f4d978"/>
      </g>
      <path d="M50 8v84M8 50h84M20.3 20.3l59.4 59.4M79.7 20.3 20.3 79.7" fill="none" stroke="#f4d978" stroke-width=".65" opacity=".72"/>
    </symbol>
  </svg>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="../" aria-label="Monad Place home">
        <svg class="brand-icon" aria-hidden="true"><use href="#monad-flower"/></svg>
        <span class="brand-text"><span class="brand-name">Monad Place</span><span class="brand-tag">Event Space · Media Services · Content Creation</span></span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="../articles/">Articles</a><a href="../events/" aria-current="page">Community Events</a>
        <a href="../#space">The Space</a><a href="../#services">Media Services</a><a href="../#packages">Packages</a><a class="nav-cta" href="../#inquiry">Plan an Event <span class="arrow" aria-hidden="true">&rarr;</span></a>
      </nav>
    </div>
  </header>
  <main class="community-shell">
    <div class="community-intro">
      <h1>Community Events</h1>
      <p>Explore public gatherings at Monad Place in the Phoenix area.</p>
    </div>
    <div class="event-section-links" role="group" aria-label="Filter events">
      <button type="button" data-event-filter="featured" aria-pressed="true">Featured</button>
      <button type="button" data-event-filter="monad" aria-pressed="false">Monad Place</button>
      <button type="button" data-event-filter="clients" aria-pressed="false">Client Events</button>
    </div>
    <div data-event-list><p>Event details are coming soon.</p></div>
  </main>
</body>
</html>
