# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets mac-6 articles events _site/
          python3 - <<'PY'
          import os
          from html import escape
          from xml.etree.ElementTree import Element, SubElement, ElementTree
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          parts = urlsplit(os.environ['PAGES_BASE_URL'])
          if parts.scheme not in ('http', 'https') or not parts.hostname:
              raise SystemExit('Expected a valid GitHub Pages base URL')
          base_url = urlunsplit(parts._replace(scheme='https')).rstrip('/')
          routes = {'': 'index.html', 'articles/': 'articles/index.html', 'events/': 'events/index.html'}
          sitemap = Element('urlset', xmlns='http://www.sitemaps.org/schemas/sitemap/0.9')
          for slug, route in routes.items():
              page = Path('_site') / route
              page.write_text(page.read_text().replace('https://monadplace.github.io/Monad-Place', escape(base_url, quote=True)))
              SubElement(SubElement(sitemap, 'url'), 'loc').text = f'{base_url}/{slug}'
          ElementTree(sitemap).write('_site/sitemap.xml', encoding='utf-8', xml_declaration=True)
          (Path('_site') / 'robots.txt').write_text(f'User-agent: *\nAllow: /\n\nSitemap: {base_url}/sitemap.xml\n')
          PY
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the public website files
          path: '_site'
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
